<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peelin's — Admin Moderation Control Center</title>
  <link rel="stylesheet" href="/css/glass.css?v=8.0">
  <link rel="stylesheet" href="/css/admin.css?v=8.0">
</head>

<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="admin-brand" style="display: flex; align-items: center; gap: 12px; padding: 16px 20px;">
        <img src="/images/peelins_logo.jpg" alt="Peelin's Logo" style="width: 44px; height: 44px; border-radius: 12px; object-fit: cover; box-shadow: 0 4px 18px rgba(255, 0, 127, 0.55); border: 1.5px solid rgba(255,255,255,0.2);" />
        <div>
          <div style="display: flex; align-items: center; gap: 6px;">
            <h2 class="admin-brand-title" style="margin: 0; font-size: 1.35rem; font-weight: 900; letter-spacing: -0.5px;">Peelin's</h2>
            <span style="background: #ff007f; color: #fff; font-size: 0.65rem; font-weight: 900; padding: 1px 6px; border-radius: 6px;">18+</span>
          </div>
          <span style="font-size: 0.72rem; color: #ff94c2; font-weight: 700; letter-spacing: 0.2px;">Meet Live • Feel Real</span>
        </div>
      </div>

      <nav class="admin-nav">
        <a class="admin-nav-item active" data-view="dashboard">
          <span>📊</span> Dashboard
        </a>
        <a class="admin-nav-item" data-view="users">
          <span>👥</span> Users
          <span class="admin-nav-badge">0</span>
        </a>
        <a class="admin-nav-item" data-view="verifications">
          <span>🤳</span> Verifications
          <span class="admin-nav-badge" style="background: rgba(255,255,255,0.15);">0</span>
        </a>
        <a class="admin-nav-item" data-view="photos">
          <span>🖼️</span> Photo Moderation
          <span class="admin-nav-badge" style="background: rgba(255,255,255,0.15);">0</span>
        </a>
        <a class="admin-nav-item" data-view="reports">
          <span>🚨</span> Reports
          <span class="admin-nav-badge" style="background: rgba(255,255,255,0.15);">0</span>
        </a>
        <a class="admin-nav-item" data-view="calls">
          <span>📞</span> Calls Log
        </a>
        <a class="admin-nav-item" data-view="payments">
          <span>💳</span> UPI Payments
          <span class="admin-nav-badge" style="background: rgba(255,255,255,0.15);">0</span>
        </a>
        <a class="admin-nav-item" data-view="creators">
          <span>🎭</span> Creators & Call Rates
          <span class="admin-nav-badge" style="background: linear-gradient(135deg, #ff007f, #a855f7);">10</span>
        </a>
        <a class="admin-nav-item" data-view="coins">
          <span>🪙</span> Coin Packs & Offers
        </a>
        <a class="admin-nav-item" data-view="warnings">
          <span>⚠️</span> User Warnings
        </a>
        <a class="admin-nav-item" data-view="gateways">
          <span>⚡</span> Payment & APIs Hub
          <span class="admin-nav-badge" style="background: #8b5cf6;">PRO</span>
        </a>
        <a class="admin-nav-item" data-view="broadcast">
          <span>📢</span> Broadcast Alert
        </a>
        <a class="admin-nav-item" data-view="settings">
          <span>⚙️</span> App Settings
        </a>
      </nav>

      <div style="margin-top: auto; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.1);">
        <a href="https://hipa-admin.pages.dev" target="_blank" class="btn-secondary"
          style="width: 100%; font-size: 0.85rem; padding: 10px; text-decoration: none; display: block; text-align: center;">←
          Go to Dating App</a>
      </div>
    </aside>

    <!-- Main Content Panel -->
    <main class="admin-main" id="adminMainContent">
      <!-- Dynamic View Loaded Here -->
    </main>
  </div>

  <script type="module" src="/js/admin.js?v=8.0"></script>
</body>

</html>
