<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1033">
  <meta name="description" content="Hipa - Modern Glassmorphic Dating App with real-time matching and audio/video calling.">
  <title>Hipa — Connect & Vibe</title>
  
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/glass.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app-root">
    <!-- Top Navigation Bar -->
    <header class="top-nav">
      <div class="brand-container">
        <div class="brand-logo">♥</div>
        <span class="brand-title">Hipa</span>
      </div>
      <div class="top-actions">
        <span class="glass-pill" id="userSwipesCount" style="font-size: 0.76rem;">25 Swipes</span>
        <button class="lang-btn" id="btnLangToggle">हिन्दी</button>
        <a href="/admin/" class="admin-link-badge" title="Open Admin Panel">Admin ⚙</a>
      </div>
    </header>

    <!-- Main Viewport (Dynamically rendered tab) -->
    <main class="main-viewport" id="mainViewport">
      <!-- Injected via app.js -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <a href="#" class="nav-item active" data-tab="discover">
        <span class="nav-icon">🔥</span>
        <span data-i18n="nav_discover">Discover</span>
      </a>
      <a href="#" class="nav-item" data-tab="likes">
        <span class="nav-icon">⭐</span>
        <span data-i18n="nav_likes">Likes</span>
        <span class="nav-badge">4</span>
      </a>
      <a href="#" class="nav-item" data-tab="chats">
        <span class="nav-icon">💬</span>
        <span data-i18n="nav_chats">Chats</span>
        <span class="nav-badge">2</span>
      </a>
      <a href="#" class="nav-item" data-tab="profile">
        <span class="nav-icon">👤</span>
        <span data-i18n="nav_profile">Profile</span>
      </a>
    </nav>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
