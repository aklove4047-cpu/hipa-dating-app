<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff007f">
  <meta name="description" content="Hipa — Where Feelings Connect. Audio & Video calling with verified creators.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Hipa — Where Feelings Connect</title>

  <script>
    // Bulletproof Cache Purge
    (function () {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          for (var r of regs) r.unregister();
        });
      }
      if ('caches' in window) {
        caches.keys().then(function (names) {
          for (var name of names) caches.delete(name);
        });
      }
      var obsoleteKeys = ['dating_user', 'dating_profiles', 'dating_swipes', 'dating_matches', 'active_chat', 'hipa_matches', 'dating_users'];
      obsoleteKeys.forEach(function (k) { localStorage.removeItem(k); });
    })();
  </script>

  <link rel="stylesheet" href="/css/hipa.css?v=9.0">
</head>
<body>
  <div class="hipa-viewport hima-viewport" id="hipaAppRoot">
    <!-- Top Bar (Shown when user is authenticated) -->
    <header class="hipa-topbar hima-topbar" id="hipaTopBar">
      <div class="hipa-brand">
        <div class="hipa-logo-icon" style="background: transparent; overflow: hidden; border: none; width: 38px; height: 38px; border-radius: 10px; box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);">
          <img src="/images/hipa_brand_logo.jpg" style="width: 100%; height: 100%; object-fit: cover;" />
        </div>
        <div class="hipa-brand-info">
          <div style="display: flex; align-items: center; gap: 6px;">
            <h1 style="background: linear-gradient(135deg, #ff007f 0%, #ff2a85 50%, #7928ca 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900;">Hipa</h1>
            <span class="badge-18-plus">18+</span>
          </div>
          <p style="color: #6b7280; font-weight: 700;">Meet Live • Feel Real</p>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <a href="/downloads/hipa-dating.apk" download="hipa-dating.apk" class="cat-pill" style="padding: 5px 12px; font-size: 0.75rem; text-decoration: none; border-color: #ff007f; color: #ff007f; font-weight: 800; background: rgba(255, 0, 127, 0.06);" title="Download Android APK">
          📲 APK
        </a>
        <button class="hipa-coin-pill hima-coin-pill" id="btnOpenWalletTop" title="My Coin Balance">
          <span class="coin-icon-circle">H</span>
          <span id="userCoinsCount">60</span>
        </button>
      </div>
    </header>

    <!-- Main Dynamic Viewport -->
    <main class="hipa-scroll-area hima-scroll-area" id="mainViewport">
      <!-- Loading Spinner Fallback -->
      <div id="hipaLoaderState" style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px;">
        <div style="width: 72px; height: 72px; border-radius: 20px; overflow: hidden; margin-bottom: 16px; box-shadow: 0 8px 30px rgba(255,0,127,0.5);">
          <img src="/images/hipa_brand_logo.jpg" style="width: 100%; height: 100%; object-fit: cover;" />
        </div>
        <h2 style="font-size: 1.6rem; font-weight: 900; background: linear-gradient(135deg, #ff007f, #7928ca); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px;">Hipa</h2>
        <p style="font-size: 0.85rem; color: #6b7280; font-weight: 700; margin-bottom: 24px;">Meet Live • Feel Real</p>
        <div style="width: 32px; height: 32px; border: 3px solid rgba(255,0,127,0.2); border-top-color: #ff007f; border-radius: 50%; animation: spinLoader 0.8s linear infinite;"></div>
        <style>@keyframes spinLoader { to { transform: rotate(360deg); } }</style>
      </div>
    </main>

    <!-- Floating Random Match Button (Shown on Home Tab) -->
    <button class="btn-floating-random" id="btnFloatingRandom" style="display: none;">
      <span>🔀</span> Random
    </button>

    <!-- Bottom Navigation Bar (4 Tabs) -->
    <nav class="hipa-bottom-nav hima-bottom-nav" id="hipaBottomNav" style="display: none;">
      <button class="hipa-nav-item hima-nav-item active" data-tab="home">
        <span class="hipa-nav-icon hima-nav-icon">🏠</span>
        <span>Home</span>
      </button>
      <button class="hipa-nav-item hima-nav-item" data-tab="recent">
        <span class="hipa-nav-icon hima-nav-icon">🕒</span>
        <span>Recent</span>
      </button>
      <button class="hipa-nav-item hima-nav-item" data-tab="friends">
        <span class="hipa-nav-icon hima-nav-icon">👥</span>
        <span>Friends</span>
      </button>
      <button class="hipa-nav-item hima-nav-item" data-tab="profile">
        <span class="hipa-nav-icon hima-nav-icon">👤</span>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <script type="module" src="/js/app.js?v=9.0"></script>
</body>
</html>
