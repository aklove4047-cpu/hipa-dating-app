<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff007f">
  <meta name="description" content="Hima — Where Feelings Connect. Audio & Video calling with verified creators.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Hima — Where Feelings Connect</title>
  
  <script>
    // Force purge old PWA cache if any existed
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var name of names) caches.delete(name);
      });
    }
  </script>

  <link rel="stylesheet" href="/css/hima.css?v=2.1">
  <link rel="stylesheet" href="/css/glass.css?v=2.1">
</head>
<body>
  <div class="hima-viewport" id="himaAppRoot">
    <!-- Top Bar (Shown when user is authenticated) -->
    <header class="hima-topbar" id="himaTopBar">
      <div class="hima-brand">
        <div class="hima-logo-icon">💬</div>
        <div class="hima-brand-info">
          <h1>Hima</h1>
          <p>Where Feelings Connect</p>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <a href="/downloads/hipa-dating.apk" download="hipa-dating.apk" class="cat-pill" style="padding: 4px 10px; font-size: 0.72rem; text-decoration: none; border-color: #ff007f; color: #ff007f;" title="Download Android APK">
          📲 APK
        </a>
        <button class="hima-coin-pill" id="btnOpenWalletTop" title="My Coin Balance">
          <span class="coin-icon-circle">H</span>
          <span id="userCoinsCount">60</span>
        </button>
      </div>
    </header>

    <!-- Main Dynamic Viewport -->
    <main class="hima-scroll-area" id="mainViewport">
      <!-- Injected dynamically via app.js -->
    </main>

    <!-- Floating Random Match Button (Shown on Home Tab) -->
    <button class="btn-floating-random" id="btnFloatingRandom" style="display: none;">
      <span>🔀</span> Random
    </button>

    <!-- Bottom Navigation Bar (4 Tabs) -->
    <nav class="hima-bottom-nav" id="himaBottomNav" style="display: none;">
      <button class="hima-nav-item active" data-tab="home">
        <span class="hima-nav-icon">🏠</span>
        <span>Home</span>
      </button>
      <button class="hima-nav-item" data-tab="recent">
        <span class="hima-nav-icon">🕒</span>
        <span>Recent</span>
      </button>
      <button class="hima-nav-item" data-tab="friends">
        <span class="hima-nav-icon">👥</span>
        <span>Friends</span>
      </button>
      <button class="hima-nav-item" data-tab="profile">
        <span class="hima-nav-icon">👤</span>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <script type="module" src="/js/app.js?v=2.1"></script>
</body>
</html>
